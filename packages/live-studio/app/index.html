<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1C1C" />
    <title>Studio</title>
    <link rel="icon" href="data:," />
    <script>
      // A phone on a bad line can miss the page's own code: say so, instead of a blank page
      addEventListener(
        "error",
        (e) => {
          if (e.target instanceof HTMLScriptElement && e.target.type === "module")
            document.getElementById("root").innerHTML =
              '<p style="margin:12px;color:#DFDFDF;font:16px system-ui">Couldn’t load the studio. Check your connection, then reload.</p>';
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
