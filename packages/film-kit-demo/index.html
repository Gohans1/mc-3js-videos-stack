<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>film-kit: Steve before / after</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15191c;
        color: #e8ecef;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      canvas {
        display: block;
      }
      .tag {
        position: fixed;
        top: 12px;
        padding: 4px 8px;
        background: #000a;
        border-radius: 4px;
        max-width: 34vw;
      }
      #old {
        left: 12px;
      }
      #new {
        right: 12px;
        text-align: right;
      }
      #clock {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-variant-numeric: tabular-nums;
        background: #000a;
        padding: 4px 8px;
        border-radius: 4px;
      }
      #info {
        position: fixed;
        right: 12px;
        top: 56px;
        white-space: pre;
        background: #000a;
        padding: 4px 8px;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
      #ui {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        background: #2a3035;
        color: inherit;
        border: 1px solid #4a5258;
        border-radius: 4px;
        padding: 6px 10px;
        min-height: 36px;
      }
      button[aria-pressed="true"] {
        border-color: #60e0a0;
      }
      #layers label {
        background: #000a;
        padding: 6px 8px;
        border-radius: 4px;
        min-height: 24px;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      #t {
        flex: 1 1 240px;
        min-height: 36px;
      }
    </style>
  </head>
  <body>
    <div class="tag" id="old">
      Before: the film now (smoothstep keys, breathing per pose, eyes fixed)
    </div>
    <div class="tag" id="new">After: film-kit layers (switch them below)</div>
    <div id="clock">00:00.000</div>
    <div id="info"></div>
    <div id="ui">
      <div class="row" id="layers"></div>
      <div class="row">
        <button data-scene="dig">Scene: dig (film 1:21-1:34)</button
        ><button data-scene="idle">Standing</button><button data-scene="walk">Walk</button
        ><button data-scene="reach">Reach</button><button data-scene="scare">Scare</button
        ><button data-scene="wake">Wake</button><button data-scene="mocap">Keys vs Mixamo</button
        ><button data-scene="life">Life</button><button data-scene="mc">Minecraft motion</button
        ><button data-scene="lifeMocap">Life: keys vs Mixamo</button>
        <button data-view="both">Both</button><button data-view="side">Side</button
        ><button data-view="bust">Upper body</button><button data-view="face">Face after</button
        ><button data-view="faceOld">Face before</button>
        <button data-mood="calm">Mood: neutral</button><button data-mood="tense">Tense</button
        ><button data-mood="tired">Tired</button>
      </div>
      <div class="row">
        <button id="play">Play / pause</button>
        <button data-speed="0.25">0.25x</button><button data-speed="0.5">0.5x</button
        ><button data-speed="1">1x</button>
        <input id="t" type="range" aria-label="Film time" />
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
